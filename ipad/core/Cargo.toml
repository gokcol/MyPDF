[package]
name = "mypdf-ipad-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
mypdf-milestone0 = { path = "../.." }
anyhow = "1"
serde_json = "1"
lopdf = "0.45"

[patch.crates-io]
underskrift = { path = "../../vendor/underskrift" }

[profile.release]
opt-level = 2
debug = false
