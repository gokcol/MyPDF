name: MyPDFiPad
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: HXDYTBC6ZT
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  MyPDFiPad:
    type: application
    platform: iOS
    sources: [MyPDFiPad]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mypdf.ipad.dev
        INFOPLIST_FILE: MyPDFiPad/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: MyPDFiPad/Bridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/core/target/aarch64-apple-ios/release"]
        OTHER_LDFLAGS: ["$(inherited)", "-lmypdf_ipad_core", "-lc++", "-lz", "-liconv"]
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: PencilKit.framework
      - sdk: PDFKit.framework
  MyPDFiPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mypdf.ipad.dev.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MyPDFiPad
schemes:
  MyPDFiPad:
    build:
      targets:
        MyPDFiPad: all
    test:
      targets: [MyPDFiPadTests]
