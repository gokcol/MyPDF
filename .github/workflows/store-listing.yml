name: Microsoft Store listing artwork
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Create fictional sample documents and listing logos
        shell: pwsh
        run: |
          cargo run --locked --example demo_docs -- artifacts/store-samples
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo run --locked --example store_listing_assets -- artifacts/store-listing/logos
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Capture the native Windows interface
        shell: pwsh
        run: |
          $env:MYPDF_PREVIEW_DIR = "$PWD/artifacts/store-listing/screenshots"
          $env:MYPDF_SAMPLE_DIR = "$PWD/artifacts/store-samples"
          $env:MYPDF_DATA_DIR = "$env:RUNNER_TEMP/MyPDF-store-listing-profile"
          cargo test --locked --bin mypdf store_listing_preview -- --ignored --exact desktop::preview::store_listing_preview
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($name in @('01-read', '02-stamps', '03-forms', '04-page-layout')) {
            if (!(Test-Path "$env:MYPDF_PREVIEW_DIR/$name.png")) { throw "Missing $name.png" }
          }
          Copy-Item packaging/windows/store-listing/en-US/*.txt artifacts/store-listing/
          @{
            commit = '${{ github.sha }}'
            platform = 'Windows x64'
            capture = 'Native application UI rendered by the headless egui visual test; no marketing overlays or desktop chrome'
            samples = 'Fictional documents generated by examples/demo_docs.rs'
          } | ConvertTo-Json | Set-Content artifacts/store-listing/provenance.json
      - uses: actions/upload-artifact@v6
        with:
          name: MyPDF-Store-listing-en-US
          path: artifacts/store-listing/
          if-no-files-found: error
