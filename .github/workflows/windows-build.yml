name: Windows build
# Builds MyPDF.exe for 64-bit Windows, packs it in a zip with the licenses,
# and builds the MyPDF-<version>-Setup.exe installer with Inno Setup.
# Run it by hand (Actions → Windows build → Run workflow). The zip is a download
# on the run's page; name a release tag to also attach it to that release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        default: main
      release:
        description: Attach the zip to this release tag (leave empty for a test build)
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned native build tooling
        run: python -m pip install cmake==3.31.6
      - name: Build and verify offline translation runtime
        shell: pwsh
        run: |
          & ./scripts/build-translation-windows.ps1
          & ./scripts/test-translation-runtime.ps1
          & ./scripts/test-translation-packaging.ps1
      - run: cargo build --locked --release --bin mypdf
      - name: Pack
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # Named like the release (v0.95 → MyPDF-0.95-…), or by the crate version.
          $version = if ($env:RELEASE) { $env:RELEASE.TrimStart('v') } else {
            (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          $name = "MyPDF-$version-windows-x64"
          New-Item -ItemType Directory -Path "pack\MyPDF" | Out-Null
          Copy-Item target\release\mypdf.exe pack\MyPDF\MyPDF.exe
          Copy-Item -Path @('README.md', 'LICENSE-MIT', 'LICENSE-APACHE', 'THIRD_PARTY_NOTICES.md') -Destination 'pack\MyPDF\'
          & ./scripts/copy-translation-runtime.ps1 -DestinationDirectory "$pwd\pack\MyPDF"
          Compress-Archive -Path pack\MyPDF -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "$name.zip.sha256"
          "NAME=$name" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "SETUP=MyPDF-$version-Setup" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          # The installer carries the same product version as MyPDF.exe.
          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$crate" "/DSource=$pwd\pack\MyPDF" "/O$pwd" "/F$env:SETUP" packaging\windows\MyPDF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "$env:SETUP.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:SETUP.exe" | Out-File -Encoding ascii -NoNewline "$env:SETUP.exe.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}.zip.sha256
            ${{ env.SETUP }}.exe
            ${{ env.SETUP }}.exe.sha256
      - name: Attach to the release
        if: ${{ inputs.release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release upload $env:RELEASE "$env:NAME.zip" "$env:NAME.zip.sha256" "$env:SETUP.exe" "$env:SETUP.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
