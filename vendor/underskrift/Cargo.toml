[package]
edition = "2021"
rust-version = "1.75"
name = "underskrift"
version = "0.1.4"
build = false
exclude = [
    "tests/fixtures/realworld",
    "2025_signed.pdf",
    ".serena",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "PDF digital signing library — PAdES B-B through B-LTA, PKCS#7, visible/invisible signatures, LTV, and verification"
readme = "README.md"
keywords = [
    "pdf",
    "signing",
    "pades",
    "pkcs7",
    "digital-signature",
]
categories = [
    "cryptography",
    "parser-implementations",
]
license = "BSD-2-Clause"
repository = "https://github.com/kushaldas/underskrift"

[features]
blocking = ["dep:tokio"]
default = [
    "tsp",
    "ltv",
    "visual",
    "verify",
    "blocking",
    "saci",
    "svt",
    "report",
    "inspect",
]
inspect = ["dep:serde_json"]
ltv = ["tsp"]
report = [
    "verify",
    "dep:uppsala",
]
saci = ["dep:uppsala"]
svt = [
    "dep:josekit",
    "dep:serde",
    "dep:serde_json",
]
tsp = [
    "dep:reqwest",
    "dep:tokio",
]
verify = []
visual = [
    "dep:image",
    "dep:subsetter",
    "dep:ttf-parser",
]

[lib]
name = "underskrift"
path = "src/lib.rs"

[[example]]
name = "sign_simple"
path = "examples/sign_simple.rs"

[[test]]
name = "sign_test"
path = "tests/sign_test.rs"

[[test]]
name = "trust_test"
path = "tests/trust_test.rs"

[[test]]
name = "verify_test"
path = "tests/verify_test.rs"

